  <!-- Styles personnalisés & Moteur d'Animation Motion Physics + Snap Scroll -->
  <style>
    :root {
      --bg-linen: #F7F5F0;
      --bg-card: #FDFCF9;
      --ink-primary: #141E2E;
      --ink-muted: #53637A;
      --studio-blue: #6AB3D8;
      --studio-powder: #CAE4F1;
    }

    body {
      background-color: var(--bg-linen);
      color: var(--ink-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* CSS Scroll Snapping natif sur Desktop */
    @media (min-width: 1024px) {
      html {
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }
      .snap-section {
        scroll-snap-align: start;
        scroll-snap-stop: always;
        height: 100vh;
        max-height: 100vh;
      }
    }

    /* CSS Scroll Snapping Doux & Fluide sur Mobile / Smartphone (Proximity SOTA) */
    @media (max-width: 1023px) {
      html {
        scroll-snap-type: y proximity;
        scroll-behavior: smooth;
        scroll-padding-top: 76px; /* Compense la hauteur de la navbar sticky */
        -webkit-overflow-scrolling: touch;
      }
      .snap-section {
        min-height: auto;
        scroll-snap-align: start;
        scroll-snap-stop: normal;
      }
      #section-hero {
        min-height: 100svh;
      }
    }

    /* Tabular numbers strict */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Masque d'arche et porte architecturale en plein cintre */
    .hero-door-mask {
      border-radius: 320px 320px 0 0;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .hero-door-mask {
        border-radius: 200px 200px 0 0;
      }
    }

    /* Masquage de barre de défilement horizontal */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Effet 2.5D Tilt */
    .perspective-card {
      perspective: 1000px;
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }
    .perspective-card:hover {
      transform: translateY(-4px);
    }

    /* Effet 3D Flip Card interactif pour la carte Maps */
    .perspective-1500 {
      perspective: 1500px;
    }
    .flip-card-inner {
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .flip-card-flipped {
      transform: rotateY(180deg);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Halos et Orbes de lumière flottants */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
      50% { transform: translate(40px, -30px) scale(1.15); opacity: 0.6; }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1.1); opacity: 0.25; }
      50% { transform: translate(-35px, 35px) scale(0.9); opacity: 0.55; }
    }
    .animate-float-orb-1 {
      animation: floatOrb1 9s ease-in-out infinite;
    }
    .animate-float-orb-2 {
      animation: floatOrb2 11s ease-in-out infinite;
    }

    /* --- SCÉNOGRAPHIE THÉÂTRALE DU SPLASH SCREEN (4 ACTES FLUIDES) --- */
    
    /* Acte 1 : Révélation aérienne de "Bienvenue chez Victor Nails" */
    @keyframes splashWelcomeReveal {
      0% {
        opacity: 0;
        transform: translateY(-16px) scale(0.96);
        letter-spacing: 0.14em;
        filter: blur(8px);
      }
      60% {
        opacity: 0.9;
        filter: blur(1px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scale(1);
        letter-spacing: 0.28em;
        filter: blur(0px);
      }
    }
    .animate-splash-welcome {
      animation: splashWelcomeReveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      opacity: 0;
      will-change: transform, opacity, letter-spacing, filter;
    }

    /* Acte 2 : Lettres monumentales VICTOR NAILS */
    @keyframes letterMotionIn {
      0% {
        opacity: 0;
        transform: translateY(110%) rotateX(-45deg);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0%) rotateX(0deg);
        filter: blur(0px);
      }
    }
    .letter-motion {
      display: inline-block;
      opacity: 0;
      animation: letterMotionIn 1.35s ease-in-out forwards;
      will-change: transform, opacity, filter;
    }

    /* Acte 3 : Révélation sérif soyeuse du sous-titre "Salon de manucure" */
    @keyframes splashSubtitleReveal {
      0% {
        opacity: 0;
        transform: translateX(28px) translateY(10px) skewX(-4deg);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateX(0px) translateY(0px) skewX(0deg);
        filter: blur(0px);
      }
    }
    .animate-splash-subtitle {
      animation: splashSubtitleReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.05s forwards;
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    /* Liaison scénique : Ligne funiculaire 1px s'étirant au centre */
    @keyframes hairlineExpand {
      0% { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    .animate-hairline-grow {
      transform-origin: center center;
      animation: hairlineExpand 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.35s forwards;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Acte 4 : Entrée triomphale et lueur du bouton "ENTRER DANS L'INSTITUT" */
    @keyframes splashCtaEnter {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
        filter: blur(12px);
      }
      70% {
        opacity: 0.95;
        transform: translateY(-3px) scale(1.02);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scale(1);
        filter: blur(0px);
      }
    }
    .animate-splash-cta-entry {
      animation: splashCtaEnter 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.65s forwards;
      opacity: 0;
      will-change: transform, opacity, filter;
    }

    /* Micro-mouvement invitant de la flèche d'entrée */
    @keyframes arrowNudge {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(6px); }
    }
    .animate-arrow-nudge {
      animation: arrowNudge 2.2s ease-in-out infinite 3.1s;
    }

    /* Pulsation magnétique continue de l'aura bleue minérale */
    @keyframes pillBreathe {
      0%, 100% { box-shadow: 0 0 15px rgba(106, 179, 216, 0.25); }
      50% { box-shadow: 0 0 35px rgba(106, 179, 216, 0.5); }
    }
    .animate-pill-breathe {
      animation: pillBreathe 3s ease-in-out infinite 3.1s;
    }

    /* Flottement doux de l'arche hero */
    @keyframes gentleSway {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-gentle-sway {
      animation: gentleSway 6s ease-in-out infinite;
    }

    /* Scénographie continue de franchissement de seuil (Portail Arche & Rack Focus Organique) */
    @keyframes drawArcheStroke {
      0% {
        stroke-dashoffset: 2600;
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
    .portal-screen-fadeout {
      opacity: 0 !important;
      filter: blur(18px) !important;
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1), filter 1.8s cubic-bezier(0.22, 1, 0.36, 1) !important;
    }
    .portal-content-fadeout {
      opacity: 0 !important;
      transform: scale(0.97) translateY(-10px) !important;
      filter: blur(8px) !important;
      transition: all 1.3s cubic-bezier(0.22, 1, 0.36, 1) !important;
      pointer-events: none !important;
    }

    /* --- AXE A : MICRO-SURVOLS CASUAL & PHYSIQUES TIER S+ --- */
    
    /* 1. Cartes Galerie avec Perspective & Glow Dynamique */
    .tilt-card-wrapper {
      perspective: 1200px;
      transform-style: preserve-3d;
    }
    .tilt-card-inner {
      will-change: transform;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.08s ease-out, box-shadow 0.3s ease-out;
    }
    .tilt-card-inner.is-resting {
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.65s ease-out;
    }
    .tilt-card-wrapper:hover .tilt-card-inner {
      box-shadow: 0 35px 70px -15px rgba(20, 30, 46, 0.22), 0 0 25px rgba(106, 179, 216, 0.18);
    }
    .tilt-card-glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.35) 0%, transparent 65%);
      opacity: 0;
      transition: opacity 0.3s ease;
      mix-blend-mode: overlay;
      border-radius: inherit;
    }
    .tilt-card-wrapper:hover .tilt-card-glare {
      opacity: 1;
    }

    /* 2. Boutons Magnétiques Universels (Magnetic CTA Tier S+) */
    .magnetic-item {
      transition: transform 0.75s ease-in-out, box-shadow 0.75s ease-in-out;
      will-change: transform;
      display: inline-flex;
    }
    .magnetic-item:hover {
      box-shadow: 0 12px 28px -8px rgba(106, 179, 216, 0.3);
    }

    /* 3. Prestations Hover Ripple & Glissement */
    .service-interactive-card {
      transition: transform 0.75s ease-in-out, border-color 0.7s ease-in-out, background-color 0.7s ease-in-out, box-shadow 0.75s ease-in-out;
      will-change: transform;
      position: relative;
    }
    .service-interactive-card:hover {
      transform: translateX(4px);
    }
    
    /* 4. Shimmer border le long du devis en direct */
    @keyframes borderGlowPulse {
      0%, 100% { border-color: rgba(106, 179, 216, 0.4); box-shadow: 0 20px 40px -15px rgba(20, 30, 46, 0.07); }
      50% { border-color: rgba(106, 179, 216, 0.85); box-shadow: 0 25px 50px -15px rgba(106, 179, 216, 0.25); }
    }
    .devis-glow-active {
      animation: borderGlowPulse 4s ease-in-out infinite;
    }

    /* --- AXE B : DYNAMISME DU DEVIS (ODOMETER & SHIMMER FLASH) --- */
    @keyframes priceFlash {
      0% { transform: scale(1); filter: brightness(1); }
      35% { transform: scale(1.1); filter: brightness(1.25); color: #4C809B; }
      100% { transform: scale(1); filter: brightness(1); }
    }
    .animate-price-flash {
      animation: priceFlash 0.9s ease-in-out;
    }

    @keyframes cartBadgePop {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-badge-pop {
      animation: cartBadgePop 0.85s ease-in-out;
    }

    /* --- AXE C : DRAWER BOTTOM SHEET MOBILE ULTRA-ORGANIQUE --- */
    @keyframes drawerSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0%); }
    }
    .animate-drawer-up {
      animation: drawerSlideUp 0.9s ease-in-out forwards;
    }
    .drawer-grabber {
      width: 44px;
      height: 4px;
      border-radius: 9999px;
      background: #CFDEEE;
      margin: 8px auto 14px auto;
    }

    /* --- AXE D : STAGGER TEXT REVEAL & PARALLAX --- */
    .stagger-line-wrap {
      overflow: hidden;
      display: block;
    }
    .stagger-line-inner {
      display: inline-block;
      transition: transform 1.35s ease-in-out, opacity 1.35s ease-in-out;
      will-change: transform, opacity;
    }
    .stagger-line-visible {
      transform: translateY(0%);
      opacity: 1;
    }
    .stagger-line-hidden {
      transform: translateY(115%);
      opacity: 0;
    }

    .hero-parallax-img {
      transition: transform 0.65s ease-in-out;
      will-change: transform;
    }

    /* --- ANIMATION DE LA NAVBAR (CINÉMATIQUE & ACTIVE PILL INDICATOR) --- */
    @keyframes navbarSlideDown {
      0% {
        opacity: 0;
        transform: translateY(-100%);
      }
      100% {
        opacity: 1;
        transform: translateY(0%);
      }
    }
    .animate-navbar-slide-down {
      animation: navbarSlideDown 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .nav-link-btn {
      position: relative;
      padding: 6px 12px;
      border-radius: 9999px;
      color: #555E6D;
      transition: color 0.4s ease-in-out;
    }
    .nav-link-btn:hover {
      color: #6AB3D8;
    }
    .nav-link-btn::after {
      content: '';
      position: absolute;
      bottom: 0px;
      left: 50%;
      width: 0%;
      height: 2px;
      background-color: #6AB3D8;
      border-radius: 9999px;
      transform: translateX(-50%);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-link-btn:hover::after {
      width: 60%;
    }

    /* --- SCÉNOGRAPHIE HÉRO HISTOIRE : FLIP LOGO & STORY REVEAL --- */
    @keyframes storyCardReveal {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(0.97);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) scale(1);
        filter: blur(0px);
      }
    }
    .animate-story-card {
      animation: storyCardReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity, filter;
    }

    /* --- SURVOL PRESTATIONS : EXPANSION SUR 2 COLONNES & PLEINE HAUTEUR --- */
    .services-column-wrapper {
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: width, transform;
    }
    
    .services-expanded-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 12px;
      transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (min-width: 1024px) {
      .services-expanded-active .services-expanded-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }

    /* Masquer complètement la scrollbar au survol */
    .services-hide-scrollbar::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
    }
    .services-hide-scrollbar {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    /* --- SECTION CONTACT : TYPOGRAPHIE CINÉTIQUE EN ARRIÈRE-PLAN --- */
    @keyframes kineticCharIn {
      0% {
        opacity: 0;
        transform: translateY(34px) rotateX(-45deg) scale(0.92);
        filter: blur(5px);
      }
      65% {
        opacity: 0.95;
        transform: translateY(-3px) rotateX(6deg) scale(1.02);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) rotateX(0deg) scale(1);
        filter: blur(0px);
      }
    }
    .animate-kinetic-char {
      display: inline-block;
      transform-origin: bottom center;
      animation: kineticCharIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform, opacity, filter;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EFECE4;
    }
    ::-webkit-scrollbar-thumb {
      background: #CAE4F1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9ECDE5;
    }

    /* Styles d'impression & Export PDF officiel */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #quote-pdf-template, #quote-pdf-template * {

        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
    }

    // Composant utilitaire Tilt 3D physique pour les cartes d'inspiration
    function TiltCard({ children, className = "" }) {
      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState("");
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        if (!cardRef.current || (typeof window !== 'undefined' && window.innerWidth < 1024)) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        // Rotation dynamique 3D plus sensible & tactile (max 14 deg)
        const rotateX = ((y - centerY) / centerY) * -14;
        const rotateY = ((x - centerX) / centerX) * 14;
        
        cardRef.current.style.setProperty("--mouse-x", `${(x / rect.width) * 100}%`);
        cardRef.current.style.setProperty("--mouse-y", `${(y / rect.height) * 100}%`);
        setTransformStyle(`perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) scale3d(1.04, 1.04, 1.04)`);
        setIsHovered(true);
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransformStyle("perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)");
      };

      return (
        <div 
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`tilt-card-wrapper ${className}`}
        >
          <div 
            className={`tilt-card-inner h-full w-full ${isHovered ? "is-hovered" : "is-resting"}`}
            style={{ transform: transformStyle }}
          >
            {children}
            <div className="tilt-card-glare"></div>
          </div>
        </div>
      );
    }

    // Composant Compteur Odometer animé physique
    function AnimatedPriceCounter({ value }) {
      const [displayValue, setDisplayValue] = useState(value);
      const [isFlashing, setIsFlashing] = useState(false);

      useEffect(() => {
        if (value === displayValue) return;
        setIsFlashing(true);
        const timer = setTimeout(() => {
          setIsFlashing(false);
        }, 400);

        const start = displayValue;
        const end = value;
        const duration = 780;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const current = Math.round(start + (end - start) * progress);
          setDisplayValue(current);
          if (progress < 1) {
            requestAnimationFrame(step);
          } else {
            setDisplayValue(end);
          }
        };
        requestAnimationFrame(step);

        return () => clearTimeout(timer);
      }, [value]);

      return (
        <span className={`inline-block font-mono font-bold tabular-nums transition-transform ${isFlashing ? "animate-price-flash" : ""}`}>
          {displayValue},00 €
        </span>
      );
    }

    // Composant utilitaire Bouton Magnétique doux
    function MagneticButton({ children, className = "", onClick, ...props }) {
      const btnRef = useRef(null);
      const [pos, setPos] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        if (!btnRef.current) return;
        const rect = btnRef.current.getBoundingClientRect();
        const x = (e.clientX - (rect.left + rect.width / 2)) * 0.28;
        const y = (e.clientY - (rect.top + rect.height / 2)) * 0.28;
        setPos({ x, y });
      };

      const handleMouseLeave = () => {
        setPos({ x: 0, y: 0 });
      };

      return (
        <div 
          ref={btnRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0px)` }}
          className="inline-block magnetic-btn"
        >
          <button 
            className={className} 
            onClick={onClick} 
            {...props}
          >
            {children}
          </button>
        </div>
      );
    }

    // --- COMPOSANT PRINCIPAL DE L'APPLICATION ---
    function VictorNailsApp() {
      // Détection Mobile Native : sur smartphone/tablette (< 1024px), accès direct sans splash ni porte coupée
      const isMobileDevice = typeof window !== 'undefined' && window.innerWidth < 1024;

      // État de l'écran d'accueil / Splash screen minimaliste (désactivé d'emblée sur mobile)
      const [splashDismissed, setSplashDismissed] = useState(isMobileDevice);

      // Scénographie optique de franchissement de seuil (Tracé -> Lumière blanche -> Fondu du site -> Mise au point de l'arche)
      // 'idle' | 'door_drawing' | 'light_flood' | 'light_fading' | 'focus_rack' | 'dismissed'
      const [portalStage, setPortalStage] = useState(isMobileDevice ? 'dismissed' : 'idle');
      const [archeTarget, setArcheTarget] = useState({ left: 0, top: 0, width: 0, height: 0 });

      const handleEnterInstitut = (e) => {
        if (e) e.stopPropagation();
        if (portalStage !== 'idle' || splashDismissed) return;

        // Forcer le scroll à zéro absolu avant mesure
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;

        // Mesurer la géométrie précise de l'arche du Hero (déjà superposée au chargement)
        const doorEl = document.getElementById('hero-arche-door');

        let target = { left: 0, top: 0, width: 0, height: 0 };
        if (doorEl) {
          const r = doorEl.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            target = { left: r.left, top: r.top, width: r.width, height: r.height };
          }
        }
        if (target.width === 0) {
          const isMobile = window.innerWidth < 1024;
          const w = isMobile ? Math.min(360, window.innerWidth - 32) : Math.min(520, window.innerWidth * 0.38);
          target = {
            left: isMobile ? (window.innerWidth - w) / 2 : window.innerWidth * 0.58,
            top: isMobile ? 120 : (window.innerHeight - 620) / 2,
            width: w,
            height: isMobile ? 520 : 620
          };
        }

        setArcheTarget(target);
        setPortalStage('door_drawing');

        // Scénographie Organique Développée (~5.8s au total)
        // Acte 1 (0 -> 1500ms) : Le texte du vestibule s'estompe en apesanteur, le liseré lumineux trace l'arche à l'encre d'or
        // Acte 2 (1500 -> 2900ms) : Seuil franchi, diffusion volumétrique du blanc lumineux (#FAF8F5), l'obscurité s'évapore
        setTimeout(() => {
          setPortalStage('light_flood');
        }, 1500);

        // Acte 3 (2900 -> 3900ms) : Dissipation soyeuse du blanc lumineux, éclosion progressive de l'espace lin du site
        setTimeout(() => {
          setPortalStage('light_fading');
        }, 2900);

        // Acte 4 (3900 -> 5500ms) : Rack focus photographique 35mm f/1.2 sur l'arche 1:1 (bokeh vaporeux -> netteté pure)
        setTimeout(() => {
          setPortalStage('focus_rack');
        }, 3900);

        // Acte 5 (5600ms) : Atterrissage final stabilisé, immersion complète et navbar posée
        setTimeout(() => {
          setPortalStage('dismissed');
          setSplashDismissed(true);
        }, 5600);
      };

      // État d'activation dynamique des sections : sur mobile, tout est visible dès le départ ; sur desktop, révélé au scroll
      const [visibleSections, setVisibleSections] = useState(() => {
        const isMobile = typeof window !== 'undefined' && window.innerWidth < 1024;
        return {
          "section-hero": true,
          "prestations": isMobile,
          "galerie": isMobile,
          "avis": isMobile,
          "contact": isMobile,
          "section-footer": isMobile
        };
      });

      // Index de section active pour la navigation par points
      const [currentSectionIndex, setCurrentSectionIndex] = useState(0);

      // État de sélection du devis
      const [selectedServices, setSelectedServices] = useState([]);
      const [activeCategory, setActiveCategory] = useState("all");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [isMapFlipped, setIsMapFlipped] = useState(false);
      const [quoteModalOpen, setQuoteModalOpen] = useState(false);
      const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);
      const [heroParallax, setHeroParallax] = useState({ x: 0, y: 0 });
      const [isServicesHovered, setIsServicesHovered] = useState(false);

      // États d'interaction et d'extension pour la section Avis & Équipe
      const [hoveredReviewIndex, setHoveredReviewIndex] = useState(null);
      const [hoveredTeamIndex, setHoveredTeamIndex] = useState(null);

      // Texte réactif monumental d'arrière-plan de la section Contact (2e plan)
      const [contactHoverText, setContactHoverText] = useState("Nous vous attendons");

      // Scénographie Hero Histoire : 'idle' | 'arming' | 'story'
      const [heroStoryState, setHeroStoryState] = useState('idle');
      const storyStateRef = useRef('idle');
      const hoverStoryTimerRef = useRef(null);

      useEffect(() => {
        storyStateRef.current = heroStoryState;
      }, [heroStoryState]);

      // Gestion du survol prolongé (1.5s) sur le texte Hero
      const handleStoryMouseEnter = () => {
        if (storyStateRef.current === 'idle') {
          storyStateRef.current = 'arming';
          setHeroStoryState('arming');
          if (hoverStoryTimerRef.current) clearTimeout(hoverStoryTimerRef.current);
          hoverStoryTimerRef.current = setTimeout(() => {
            if (storyStateRef.current === 'arming') {
              storyStateRef.current = 'story';
              setHeroStoryState('story');
            }
          }, 1500);
        }
      };

      const handleStoryMouseLeave = () => {
        if (storyStateRef.current === 'arming') {
          if (hoverStoryTimerRef.current) clearTimeout(hoverStoryTimerRef.current);
          storyStateRef.current = 'idle';
          setHeroStoryState('idle');
        }
      };

      // Au clic n'importe où sur la page lorsque l'histoire est active, retour en sens inverse
      useEffect(() => {
        if (heroStoryState === 'story') {
          const handleGlobalPageClick = () => {
            storyStateRef.current = 'idle';
            setHeroStoryState('idle');
          };
          const timer = setTimeout(() => {
            window.addEventListener('click', handleGlobalPageClick);
          }, 100);
          return () => {
            clearTimeout(timer);
            window.removeEventListener('click', handleGlobalPageClick);
          };
        }
      }, [heroStoryState]);

      // Vue élargie active si survolée UNIQUEMENT sur Desktop (zéro disparition d'en-tête sur tactile/mobile)
      const isExpanded = isServicesHovered && typeof window !== 'undefined' && window.innerWidth >= 1024;

      // Verrouillage étanche du scroll pendant le rideau d'accueil et la scénographie
      useEffect(() => {
        const resetScroll = () => {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        };

        resetScroll();

        const handleScrollLock = () => {
          if (!splashDismissed && (window.scrollY !== 0 || document.documentElement.scrollTop !== 0)) {
            resetScroll();
          }
        };

        if (!splashDismissed) {
          document.documentElement.style.overflow = 'hidden';
          document.body.style.overflow = 'hidden';
          window.addEventListener('scroll', handleScrollLock, { passive: false });
        } else {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }

        const handlePageShow = () => resetScroll();
        window.addEventListener('pageshow', handlePageShow);

        return () => {
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
          window.removeEventListener('scroll', handleScrollLock);
          window.removeEventListener('pageshow', handlePageShow);
        };
      }, [splashDismissed]);

      // Rafraîchir les icônes Lucide à chaque mise à jour du DOM
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Écoute des touches Entrée, Échap ou Espace pour lever le rideau
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Enter" || e.key === "Escape" || e.key === " ") {
            setSplashDismissed(true);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, []);

      // Effet Parallaxe fluide au curseur dans la porte architecturale Hero
      const handleHeroMouseMove = (e) => {
        const { clientX, clientY, innerWidth, innerHeight } = window;
        const offsetX = (clientX / innerWidth - 0.5) * -22;
        const offsetY = (clientY / innerHeight - 0.5) * -22;
        setHeroParallax({ x: offsetX, y: offsetY });
      };

      // Moteur Physique Universel : Attraction Magnétique sur TOUS les Boutons & CTAs du site
      useEffect(() => {
        const magneticElements = document.querySelectorAll(
          "button, a.rounded-full, .magnetic-target, [role='button']"
        );

        const cleanups = [];

        magneticElements.forEach((el) => {
          // Exclure les pastilles de points de navigation fixes et conteneurs trop larges
          if (el.classList.contains("no-magnetic") || el.offsetWidth > 450) return;

          el.classList.add("magnetic-item");

          const handleMouseMove = (e) => {
            const rect = el.getBoundingClientRect();
            const relX = e.clientX - (rect.left + rect.width / 2);
            const relY = e.clientY - (rect.top + rect.height / 2);
            // Facteur d'attraction doux de 0.22
            el.style.transform = `translate3d(${relX * 0.24}px, ${relY * 0.24}px, 0px)`;
          };

          const handleMouseLeave = () => {
            el.style.transform = "translate3d(0px, 0px, 0px)";
          };

          el.addEventListener("mousemove", handleMouseMove);
          el.addEventListener("mouseleave", handleMouseLeave);

          cleanups.push(() => {
            el.removeEventListener("mousemove", handleMouseMove);
            el.removeEventListener("mouseleave", handleMouseLeave);
          });
        });

        return () => {
          cleanups.forEach((c) => c());
        };
      }, [splashDismissed, activeCategory, selectedServices, isMapFlipped, quoteModalOpen]);

      // Observateur d'Intersection : Sur desktop, révélation fluide avec persistance ; sur mobile, fluidité immédiate sans disparition intempestive
      useEffect(() => {
        const isMobile = window.innerWidth < 1024;
        
        if (isMobile) {
          setVisibleSections({
            "section-hero": true,
            "prestations": true,
            "galerie": true,
            "avis": true,
            "contact": true,
            "section-footer": true
          });
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            const id = entry.target.id;
            const isVisible = entry.isIntersecting;
            
            if (isVisible) {
              setVisibleSections(prev => ({
                ...prev,
                [id]: true // Une fois révélée, la section reste toujours visible au défilement !
              }));
              const idx = SECTIONS_NAV.findIndex(s => s.id === id);
              if (idx !== -1) setCurrentSectionIndex(idx);
            }
          });
        }, { 
          threshold: isMobile ? 0.05 : 0.15
        });

        SECTIONS_NAV.forEach(s => {
          const el = document.getElementById(s.id);
          if (el) observer.observe(el);
        });

        return () => observer.disconnect();
      }, [splashDismissed]);

      // Navigation vers une section snap au clic sur les points
      const scrollToSection = (id) => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      // Calcul dynamique du devis en temps réel
      const quoteTotal = useMemo(() => {
        return selectedServices.reduce((sum, s) => sum + s.price, 0);
      }, [selectedServices]);

      const quoteDuration = useMemo(() => {
        const totalMinutes = selectedServices.reduce((sum, s) => {

                  <span>Conçu & Propulsé par Usine Web Locale (Canal 03) · Norme Anti-Slop Sanzo Wada #139</span>

              </div>
            </div>
          </footer>




          
          {/* ============================================================== */}
          {/* AXE C : FLOATING PILL & BOTTOM SHEET DRAWER SUR MOBILE         */}
          {/* ============================================================== */}
          {selectedServices.length > 0 && (
            <div 
              className="lg:hidden fixed left-4 right-4 z-40 animate-badge-pop"
              style={{ bottom: 'calc(1.25rem + env(safe-area-inset-bottom, 0px))' }}
            >
              <button 
                onClick={() => setMobileDrawerOpen(true)}
                className="w-full py-3.5 px-6 rounded-full bg-studio text-linen-50 shadow-2xl flex items-center justify-between font-sans text-sm font-semibold active:scale-95 transition-all cursor-pointer"
              >
                <div className="flex items-center gap-2.5">
                  <span className="w-6 h-6 rounded-full bg-linen-50 text-studio font-mono text-xs font-bold flex items-center justify-center">
                    {selectedServices.length}
                  </span>
                  <span>Voir mon Devis Direct</span>
                </div>
                <div className="font-mono text-base font-bold tabular-nums">
                  {quoteTotal},00 €
                </div>
              </button>
            </div>
          )}

          {/* Drawer Bottom Sheet Organique Mobile */}
          {mobileDrawerOpen && (
            <div 
              className="lg:hidden fixed inset-0 z-50 bg-ink/60 backdrop-blur-sm flex flex-col justify-end animate-fade-in"
              onClick={() => setMobileDrawerOpen(false)}
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="bg-linen-50 rounded-t-[32px] p-6 pt-3 shadow-2xl flex flex-col max-h-[85vh] animate-drawer-up border-t-2 border-studio/30"
                style={{ paddingBottom: 'calc(1.5rem + env(safe-area-inset-bottom, 0px))' }}
              >
                <div className="drawer-grabber"></div>

                <div className="flex items-center justify-between pb-3.5 border-b border-studio-powder/50">
                  <div>
                    <span className="font-mono text-[10px] uppercase tracking-widest text-studio font-bold">VOTRE PANIER EN DIRECT</span>
                    <h3 className="font-serif text-xl font-normal text-ink">Devis Personnalisé</h3>
                  </div>
                  <button 
                    onClick={() => setMobileDrawerOpen(false)}
                    className="w-8 h-8 rounded-full bg-linen-200 flex items-center justify-center text-ink-muted"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="py-4 flex flex-col gap-2.5 overflow-y-auto max-h-[45vh] pr-1">
                  {selectedServices.map(s => (
                    <div key={s.id} className="flex items-center justify-between text-sm py-1.5 px-2 bg-linen-200/50 rounded-xl">
                      <span className="text-ink font-medium truncate max-w-[200px]">{s.name}</span>
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-bold text-ink">{s.price},00 €</span>
                        <button onClick={() => toggleService(s)} className="text-ink-subtle hover:text-rose-500 p-1">
                          <i data-lucide="x" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="pt-3 border-t border-studio-powder/50 flex flex-col gap-2 mt-auto">
                  <div className="flex items-center justify-between font-mono text-xs">
                    <span className="text-ink-muted">Durée estimée :</span>
                    <span className="font-semibold text-ink">{quoteDuration}</span>
                  </div>
                  <div className="flex items-center justify-between font-mono">
                    <span className="text-sm font-semibold text-ink">Total TTC :</span>
                    <span className="text-2xl font-bold text-studio">{quoteTotal},00 €</span>
                  </div>

                  <a 
                    href={generateWhatsAppLink()}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-3.5 px-4 rounded-full bg-[#128C7E] text-linen-50 font-sans text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 mt-1 shadow-md"
                  >
                    <i data-lucide="message-circle" className="w-4 h-4"></i>
                    <span>Envoyer sur WhatsApp</span>
                  </a>

                  <button 
                    onClick={() => { setMobileDrawerOpen(false); setQuoteModalOpen(true); }}
                    className="w-full py-2.5 px-4 rounded-full bg-studio-powder/40 text-ink font-sans text-xs font-semibold flex items-center justify-center gap-2"
                  >
                    <i data-lucide="file-text" className="w-3.5 h-3.5 text-studio"></i>
                    <span>Télécharger le Devis en PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* MODALE HAUTE JOAILLERIE : DEVIS EN GRAND & TÉLÉCHARGEMENT PDF */}
          {/* ============================================================== */}
          {quoteModalOpen && (
            <div 
              role="dialog"
              aria-modal="true"
              className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-ink/70 backdrop-blur-md animate-fade-in"
              onClick={() => setQuoteModalOpen(false)}
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="relative w-full max-w-2xl bg-linen-50 border-2 border-studio/50 rounded-3xl shadow-2xl p-6 sm:p-10 flex flex-col max-h-[90vh] overflow-y-auto animate-scale-up"
              >
                {/* Bouton Fermer */}
                <button 
                  onClick={() => setQuoteModalOpen(false)}
                  className="absolute top-5 right-5 w-10 h-10 rounded-full bg-linen-200 text-ink-muted hover:text-ink hover:bg-linen-300 flex items-center justify-center transition-all"
                  aria-label="Fermer la modale"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                {/* En-tête Modale */}
                <div className="border-b border-studio-powder/60 pb-6 mb-6">
                  <span className="font-mono text-xs uppercase tracking-[0.2em] text-studio font-bold block mb-1">
                    INSTITUT VICTOR NAILS PARIS 13
                  </span>
                  <h3 className="font-serif text-2xl sm:text-3xl text-ink font-normal">
                    Devis Estimatif Personnalisé
                  </h3>
                  <p className="font-sans text-xs sm:text-sm text-ink-muted mt-1">
                    95 Rue de Patay · 75013 Paris · Métro 14 Olympiades / BNF · 06 59 13 46 89
                  </p>
                </div>

                {/* Contenu Déroulant des Prestations */}
                <div className="flex-1 flex flex-col gap-3 mb-6">
                  <div className="flex items-center justify-between text-xs font-mono uppercase tracking-wider text-ink-subtle pb-2 border-b border-studio-powder/40">
                    <span>Prestation ({selectedServices.length})</span>
                    <span>Durée / Tarif</span>
                  </div>

                  {selectedServices.length === 0 ? (
                    <div className="py-8 text-center text-ink-subtle italic text-sm">
                      Aucune prestation sélectionnée pour le moment.<br/>
                      Fermez la modale et cliquez sur les soins désirés dans la carte.
                    </div>
                  ) : (
                    selectedServices.map((s, idx) => (
                      <div key={idx} className="flex items-center justify-between py-2 border-b border-studio-powder/20 font-sans text-sm">
                        <div>
                          <p className="font-semibold text-ink">{s.name}</p>
                          <p className="text-xs text-ink-muted">{s.desc}</p>
                        </div>
                        <div className="flex flex-col items-end shrink-0 pl-4 font-mono">
                          <span className="font-bold text-ink tabular-nums">{s.price},00 €</span>
                          <span className="text-[11px] text-ink-subtle">{s.time}</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>

                {/* Totaux & Synthèse */}
                <div className="p-4 sm:p-5 rounded-2xl bg-linen-200 border border-studio-powder/60 mb-6">
                  <div className="flex justify-between items-center text-sm font-mono text-ink-muted mb-2">
                    <span>Durée totale estimée en cabine :</span>
                    <span className="font-bold text-ink">{quoteDuration}</span>
                  </div>
                  <div className="flex justify-between items-center text-base sm:text-lg font-mono text-ink pt-2 border-t border-studio-powder/40">
                    <span className="font-semibold">Montant Total Estimé (TTC) :</span>
                    <span className="text-2xl sm:text-3xl font-bold text-studio tabular-nums">{quoteTotal},00 €</span>
                  </div>
                </div>

                {/* Actions : Téléchargement PDF & Envoi WhatsApp */}
                <div className="flex flex-col sm:flex-row items-center gap-3 font-sans">
                  <button 
                    onClick={handleDownloadPDF}
                    className="w-full sm:flex-1 py-3.5 px-6 rounded-full bg-studio hover:bg-studio-dark text-linen-50 font-semibold text-sm flex items-center justify-center gap-2 shadow-luxury transition-all active:scale-95"
                  >
                    <i data-lucide="download" className="w-4 h-4"></i>
                    <span>Télécharger le Devis en PDF</span>
                  </button>

                  <a 
                    href={generateWhatsAppLink()}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full sm:flex-1 py-3.5 px-6 rounded-full bg-[#128C7E] hover:bg-[#075E54] text-linen-50 font-semibold text-sm flex items-center justify-center gap-2 shadow-sm transition-all active:scale-95"
                  >
                    <i data-lucide="message-circle" className="w-4 h-4"></i>
                    <span>Valider sur WhatsApp</span>
                  </a>
                </div>
              </div>
            </div>
          )}



        </div>
      );
    }

    // Rendu racine React 18 Production UMD
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<VictorNailsApp />);
  </script>
</body>
</html>
